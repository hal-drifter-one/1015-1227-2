<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #121a2b;
      --panel: rgba(17, 24, 39, 0.9);
      --panel-strong: #101827;
      --panel-alt: #172033;
      --line: rgba(148, 163, 184, 0.16);
      --text: #e5edf7;
      --text-soft: #a7b5ca;
      --accent: #7dd3fc;
      --accent-strong: #38bdf8;
      --accent-warm: #f59e0b;
      --danger: #f87171;
      --shadow: 0 18px 42px rgba(15, 23, 42, 0.45);
      --radius: 18px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(34, 211, 238, 0.12), transparent 25%),
        radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.12), transparent 22%),
        linear-gradient(135deg, #070d17 0%, #0e1525 100%);
      color: var(--text);
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 280px;
      background: rgba(10, 15, 25, 0.82);
      backdrop-filter: blur(14px);
      border-right: 1px solid var(--line);
      color: var(--text);
      padding: 1.4rem 1rem;
      overflow-y: auto;
      box-shadow: inset -1px 0 0 rgba(148, 163, 184, 0.12);
    }

    .sidebar h3 {
      margin-bottom: 0.9rem;
      padding: 0.1rem 0.2rem 0.7rem;
      font-size: 1rem;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--line);
      color: var(--text-soft);
      text-transform: uppercase;
    }

    .sidebar-section {
      margin-bottom: 2rem;
      background: rgba(148, 163, 184, 0.04);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem;
    }

    .file-input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    #fileInput {
      width: 100%;
      padding: 0.7rem 0.75rem;
      border-radius: 10px;
      border: 1px solid rgba(125, 211, 252, 0.35);
      background: rgba(15, 23, 42, 0.85);
      color: var(--text);
      cursor: pointer;
    }

    #uploadButton {
      padding: 0.85rem 1rem;
      background: linear-gradient(135deg, var(--accent-strong), var(--accent));
      color: #041018;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 24px rgba(56, 189, 248, 0.28);
    }

    #uploadButton:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(56, 189, 248, 0.35);
    }

    .file-list {
      margin-top: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.88rem;
    }

    .file-item {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.7rem 0.75rem;
      word-break: break-all;
      color: var(--text-soft);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 1rem;
    }

    .content-area {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      gap: 1rem;
      min-height: 0;
    }

    .section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-height: 0;
    }

    #chatSection {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      padding: 0.9rem 1rem;
      background: rgba(17, 24, 39, 0.9);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .chat-clear-btn {
      padding: 0.55rem 0.9rem;
      background: rgba(248, 113, 113, 0.12);
      color: #fecaca;
      border: 1px solid rgba(248, 113, 113, 0.2);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s ease;
    }

    .chat-clear-btn:hover {
      background: rgba(248, 113, 113, 0.2);
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      min-height: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.9));
    }

    .chat-message {
      margin-bottom: 0.9rem;
      padding: 0.8rem 0.9rem;
      border-radius: 16px;
      max-width: 86%;
      word-wrap: break-word;
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      border: 1px solid transparent;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.12);
    }

    .chat-message.user {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #05243a;
      margin-left: auto;
      margin-right: 0;
      flex-direction: row-reverse;
      border-color: rgba(255, 255, 255, 0.12);
    }

    .chat-message.bot {
      background: rgba(148, 163, 184, 0.09);
      color: var(--text);
      border-color: rgba(148, 163, 184, 0.12);
    }

    .chat-message-content {
      flex: 1;
      cursor: pointer;
      user-select: text;
      line-height: 1.5;
    }

    .chat-message-actions {
      display: flex;
      gap: 0.35rem;
      align-items: center;
    }

    .chat-message-btn {
      background: rgba(255, 255, 255, 0.18);
      border: none;
      color: inherit;
      cursor: pointer;
      padding: 0.35rem 0.45rem;
      border-radius: 8px;
      font-size: 0.78rem;
      transition: background 0.2s ease;
    }

    .chat-message-btn:hover {
      background: rgba(255, 255, 255, 0.23);
    }

    .chat-input-area {
      padding: 0.9rem 1rem 1rem;
      border-top: 1px solid var(--line);
      background: rgba(10, 15, 25, 0.9);
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    #chatInput {
      flex: 1;
      min-width: 150px;
      padding: 0.85rem 1rem;
      border: 1px solid rgba(148, 163, 184, 0.15);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
    }

    #chatInput:focus {
      border-color: rgba(125, 211, 252, 0.5);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .chat-button-group {
      display: flex;
      gap: 0.5rem;
    }

    #chatSendButton, #stampMenuBtn {
      padding: 0.8rem 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    #chatSendButton {
      background: linear-gradient(135deg, #7dd3fc, #38bdf8);
      color: #06253a;
      min-width: 92px;
    }

    #stampMenuBtn {
      background: linear-gradient(135deg, #f5d0fe, #c084fc);
      color: #2f0b3a;
    }

    #chatSendButton:hover, #stampMenuBtn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .stamp-menu {
      position: absolute;
      bottom: 5.5rem;
      right: 1rem;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.8rem;
      display: none;
      z-index: 1000;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.5rem;
      max-width: 250px;
      box-shadow: var(--shadow);
    }

    .stamp-menu.active {
      display: grid;
    }

    .stamp-item {
      font-size: 1.8rem;
      cursor: pointer;
      text-align: center;
      padding: 0.45rem;
      border-radius: 10px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .stamp-item:hover {
      background: rgba(148, 163, 184, 0.08);
      transform: scale(1.05);
    }

    #videoSection {
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.92), rgba(15, 23, 42, 0.9));
      padding: 1rem;
      overflow: hidden;
    }

    .video-player-wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      justify-content: center;
    }

    #youtubePlayer {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: #000;
    }

    .sync-info {
      color: var(--text-soft);
      padding: 0.9rem 0 0;
      text-align: center;
      font-size: 0.9rem;
    }

    #syncStatus {
      margin: 0;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(125, 211, 252, 0.2);
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: auto;
      }

      .sidebar {
        width: 100%;
        max-height: 220px;
        overflow-x: auto;
        padding: 1rem;
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      .main-content {
        padding: 0.75rem;
      }

      .content-area {
        flex-direction: column;
      }

      .section {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-section">
      <h3>📁 ファイルアップロード</h3>
      <div class="file-input-wrapper">
        <input type="file" id="fileInput" multiple>
        <button id="uploadButton">アップロード</button>
      </div>
    </div>
    <div class="sidebar-section">
      <h3>📂 アップロード済み</h3>
      <div class="file-list" id="fileList"></div>
    </div>
  </div>

  <div class="main-content">
    <div class="content-area">
      <div id="chatSection" class="section">
        <div class="chat-header">
          <h3>💬 チャット</h3>
          <button class="chat-clear-btn" id="clearAllBtn">全削除</button>
        </div>
        <div class="chat-container">
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="メッセージを入力...">
            <div class="chat-button-group">
              <button id="stampMenuBtn">😊 スタンプ</button>
              <button id="chatSendButton">送信</button>
            </div>
          </div>
          <div class="stamp-menu" id="stampMenu">
            <span class="stamp-item" data-stamp="😊">😊</span>
            <span class="stamp-item" data-stamp="😂">😂</span>
            <span class="stamp-item" data-stamp="😍">😍</span>
            <span class="stamp-item" data-stamp="🎉">🎉</span>
            <span class="stamp-item" data-stamp="👍">👍</span>
            <span class="stamp-item" data-stamp="❤️">❤️</span>
            <span class="stamp-item" data-stamp="🔥">🔥</span>
            <span class="stamp-item" data-stamp="👏">👏</span>
            <span class="stamp-item" data-stamp="🎯">🎯</span>
            <span class="stamp-item" data-stamp="💯">💯</span>
            <span class="stamp-item" data-stamp="🚀">🚀</span>
            <span class="stamp-item" data-stamp="⭐">⭐</span>
          </div>
        </div>
      </div>

      <div id="videoSection" class="section">
        <div class="video-player-wrapper">
          <div id="youtubePlayer"></div>
          <div class="sync-info">
            <p id="syncStatus">同期状態: 接続中...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src=\"https://www.youtube.com/iframe_api\"></script>
  <script src=\"https://cdn.socket.io/4.5.4/socket.io.min.js\"></script>
  <script src="script.js"></script>
</body>
</html>
